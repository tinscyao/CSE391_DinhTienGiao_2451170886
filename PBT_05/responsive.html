
<!DOCTYPE html>
<html lang="en">
<head>

    <title>Responsive Product Page</title>
    <link rel="stylesheet" href="responsive.css">
</head>

            <img src="https://picsum.photos/300/200?3" alt="">

            <img src="https://picsum.photos/300/200?5" alt="">

        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?6" alt="">

            <p>$60</p>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?7" alt="">
            <h3>Product 7</h3>
            <p>$70</p>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?8" alt="">
            <h3>Product 8</h3>
            <p>$80</p>
        </div>
    </main>

    <aside class="ads">
        <h3>Ads</h3>
    </aside>

</div>

<footer>
    <p>© 2026 Responsive Shop</p>
</footer>

</body>
</html>
